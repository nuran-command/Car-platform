<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheelHouse | Premium Cars</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">WHEEL<span>HOUSE</span></div>
        <div class="nav-links">
            <a href="#" onclick="showSection('home')">Home</a>
            <a href="#showroom" onclick="showSection('showroom')">Showroom</a>
            <a href="#" id="dashboardLink" style="display:none;">Dashboard</a>
        </div>
        <div class="nav-auth">
            <a href="#" id="loginBtn" onclick="openModal('auth-modal')">Login</a>
            <button id="addCarBtn" class="btn-primary" onclick="openModal('add-car-modal')" style="display:none;">+ ADD CAR</button>
            <a href="#" id="logoutBtn" onclick="logout()" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </nav>

    <header id="home" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <p class="subtitle">Cars That Inspire</p>
            <h1>Explore, Compare, Own</h1>
            <div class="price-badge">
                Starting <span>$12,999</span>
            </div>
            <button class="btn-outline" onclick="document.getElementById('showroom').scrollIntoView({behavior:'smooth'})">
                Read More <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </header>
    <div class="search-bar-container">
        <form class="search-bar" onsubmit="event.preventDefault(); filterCars();">
            <input type="text" id="searchBrand" placeholder="Make (e.g. BMW)">
            <select id="searchType">
                <option value="">All Types</option>
                <option value="New">New</option>
                <option value="Used">Used</option>
            </select>
            <input type="number" id="maxPrice" placeholder="Max Price">
            <button type="submit" class="btn-primary">SEARCH</button>
        </form>
    </div>

    <section id="showroom" class="container">
        <div class="section-header">
            <h2>FEATURED <span>LISTINGS</span></h2>
            <p>Browse our premium collection of vehicles.</p>
        </div>
        
        <div id="loading" class="loading-spinner" style="display:none;">Loading...</div>
        <div id="car-grid" class="car-grid">
            </div>
    </section>

    <div id="auth-modal" class="modal">
        <div class="modal-content small-modal">
            <span class="close" onclick="closeModal('auth-modal')">&times;</span>
            <h2 id="authTitle">Login</h2>
            <form id="authForm">
                <div class="input-group" id="usernameField" style="display:none;">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary full-width">SUBMIT</button>
                <p class="switch-auth" onclick="toggleAuthMode()">No account? <span>Register here</span></p>
            </form>
        </div>
    </div>

    <div id="add-car-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('add-car-modal')">&times;</span>
            <h2>Add New Vehicle</h2>
            <form id="addCarForm">
                <div class="form-grid">
                    <input type="text" id="carBrand" placeholder="Make (e.g. Audi)" required>
                    <input type="text" id="carModel" placeholder="Model (e.g. A4)" required>
                    <input type="number" id="carYear" placeholder="Year" required>
                    <input type="number" id="carPrice" placeholder="Price ($)" required>
                    <input type="text" id="carImage" placeholder="Image URL (http://...)" required>
                    <select id="carCondition">
                        <option value="New">New</option>
                        <option value="Used">Used</option>
                    </select>
                </div>
                <textarea id="carDesc" placeholder="Description..." rows="3"></textarea>
                <button type="submit" class="btn-primary full-width">List Car</button>
            </form>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content large-modal">
            <span class="close" onclick="closeModal('details-modal')">&times;</span>
            <div id="modal-body" class="details-grid">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
